name: Deploy site

on:
  push:
    branches:
      - master
      - main
    paths:
      - "assets/**"
      - "cv-source/**"
      - "**.bib"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/*.md"
      - "**.tex"
      - "**.yml"
      - "Gemfile"
      - "Gemfile.lock"
      - "!.github/workflows/axe.yml"
      - "!.github/workflows/broken-links.yml"
      - "!.github/workflows/deploy-docker-tag.yml"
      - "!.github/workflows/deploy-image.yml"
      - "!.github/workflows/docker-slim.yml"
      - "!.github/workflows/lighthouse-badger.yml"
      - "!.github/workflows/prettier.yml"
      - "!lighthouse_results/**"
      - "!CONTRIBUTING.md"
      - "!CUSTOMIZE.md"
      - "!FAQ.md"
      - "!INSTALL.md"
      - "!README.md"
  pull_request:
    branches:
      - master
      - main
    paths:
      - "assets/**"
      - "cv-source/**"
      - "**.bib"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/*.md"
      - "**.tex"
      - "**.yml"
      - "Gemfile"
      - "Gemfile.lock"
      - "!.github/workflows/axe.yml"
      - "!.github/workflows/broken-links.yml"
      - "!.github/workflows/deploy-docker-tag.yml"
      - "!.github/workflows/deploy-image.yml"
      - "!.github/workflows/docker-slim.yml"
      - "!.github/workflows/lighthouse-badger.yml"
      - "!.github/workflows/prettier.yml"
      - "!lighthouse_results/**"
      - "!CONTRIBUTING.md"
      - "!CUSTOMIZE.md"
      - "!FAQ.md"
      - "!INSTALL.md"
      - "!README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Sync publications bib for academic CV 🔗
        run: cp _bibliography/papers.bib cv-source/academic-cv/publications.bib

      - name: Compile resume (LaTeX → PDF) 📄
        uses: xu-cheng/latex-action@v3
        with:
          root_file: resume.tex
          working_directory: cv-source
          latexmk_use_xelatex: false
          args: -pdf -interaction=nonstopmode -halt-on-error

      - name: Compile academic CV (LaTeX → PDF) 📄
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: cv-source/academic-cv
          latexmk_use_xelatex: false
          args: -pdf -interaction=nonstopmode -halt-on-error

      - name: Stage CV PDFs into assets 📦
        run: |
          mkdir -p assets/pdf
          cp cv-source/resume.pdf assets/pdf/Vedant_Naik_Resume.pdf
          cp cv-source/academic-cv/main.pdf assets/pdf/Vedant_Naik_CV.pdf

      - name: Setup Ruby 💎
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true

      - name: Setup Python 🐍
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Update _config.yml ⚙️
        uses: fjogeleit/yaml-update-action@main
        with:
          commitChange: false
          valueFile: "_config.yml"
          propertyPath: "giscus.repo"
          value: ${{ github.repository }}

      - name: Install and Build 🔧
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          pip3 install --upgrade nbconvert
          export JEKYLL_ENV=production
          bundle exec jekyll build

      - name: Purge unused CSS 🧹
        run: |
          npm install -g purgecss
          purgecss -c purgecss.config.js

      - name: Deploy to GitHub Pages 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
          branch: gh-pages

      - name: Extract msu.url
        id: extract_url
        uses: mikefarah/yq@master
        with:
          cmd: yq '.msu.url' _config.yml

      - name: Extract msu.baseurl
        id: extract_baseurl
        uses: mikefarah/yq@master
        with:
          cmd: yq '.msu.baseurl' _config.yml

      - name: Update _config.yml for MSU ⚙️
        uses: fjogeleit/yaml-update-action@main
        with:
          commitChange: false
          valueFile: "_config.yml"
          changes: |
            {
              "url": "${{steps.extract_url.outputs.result}}",
              "baseurl": "${{ steps.extract_baseurl.outputs.result}}"
            }

      - name: Build for MSU 🏛️
        run: |
          export JEKYLL_ENV=msu
          bundle exec jekyll build

      - name: Purge unused CSS for MSU 🧹
        run: |
          purgecss -c purgecss.config.js

      - name: Deploy to MSU Branch 🎓
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
          branch: gh-pages-msu
